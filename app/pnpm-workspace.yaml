allowBuilds:
  '@ainblockchain/ain-js': set this to true or false
  '@coinbase/x402': set this to true or false
  '@opensea/seaport-js': set this to true or false
  bigint-buffer: set this to true or false
  bufferutil: set this to true or false
  eccrypto: set this to true or false
  esbuild: set this to true or false
  keccak: set this to true or false
  opensea-js: set this to true or false
  postinstall-postinstall: set this to true or false
  secp256k1: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
  utf-8-validate: set this to true or false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# AgentKit ships prebundled code that imports @scure/bip39/wordlists/english,
# a subpath 2.x stopped exporting. Pin the copy AgentKit resolves to 1.x.
minimumReleaseAgeExclude:
  - ain-ui@0.1.1
overrides:
  "@coinbase/agentkit>@scure/bip39": ^1.5.4
  # pptx-preview pins echarts ^5 (XSS advisory, fixed in 6.1.0). The preview's
  # chart patch (src/components/previews/pptx.tsx) must also hit the SAME
  # echarts instance pptx-preview draws with, so both resolve to the app's 6.x.
  "pptx-preview>echarts": ^6.1.0
