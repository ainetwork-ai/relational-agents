# Production stack for memory.ainetwork.ai.
#
# Deliberately a separate file and a separate compose project from
# docker-compose.yml: `docker compose up` during development must never touch
# what is live. Run it explicitly:
#
#   docker compose -f docker-compose.prod.yml up -d
#
name: memory-live

services:
  app:
    image: memory-live-app:${APP_TAG:-latest}
    build:
      context: ./app
      # Every NEXT_PUBLIC_* the Dockerfile declares must be listed here. These
      # are inlined into the browser bundle at BUILD time, so setting one in
      # .env.prod and restarting does nothing — it needs a rebuild and a new
      # APP_TAG. Leaving one out is worse than useless: the server still reads
      # it at runtime, so the two halves can disagree with no error anywhere.
      args:
        NEXT_PUBLIC_RELATION_REGISTRY_ADDRESS: ${NEXT_PUBLIC_RELATION_REGISTRY_ADDRESS}
        NEXT_PUBLIC_RELATION_REGISTRY_CHAIN_ID: ${NEXT_PUBLIC_RELATION_REGISTRY_CHAIN_ID}
        NEXT_PUBLIC_HUMANBACKED_REGISTRY_ADDRESS: ${NEXT_PUBLIC_HUMANBACKED_REGISTRY_ADDRESS:-}
        NEXT_PUBLIC_WORLD_ID_APP_ID: ${NEXT_PUBLIC_WORLD_ID_APP_ID:-}
        NEXT_PUBLIC_WORLD_ID_ACTION: ${NEXT_PUBLIC_WORLD_ID_ACTION:-}
        NEXT_PUBLIC_SUI_PACKAGE_ID: ${NEXT_PUBLIC_SUI_PACKAGE_ID:-}
        NEXT_PUBLIC_CALL_WEB_SPEECH: ${NEXT_PUBLIC_CALL_WEB_SPEECH:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # gitignored by the .env* rule — secrets stay out of git without living
      # outside the project, where nobody would find them.
      - .env.prod
    environment:
      # Inside the compose network the DB is a service name, not a host port.
      POSTGRES_URL: postgresql://memory_live:${POSTGRES_PASSWORD}@postgres:5432/memory_live
      OKF_ROOT: /data/okf
      MD_MIRROR_ROOT: /data/md-mirror
      # The default AI_URL is localhost:8100, which inside a container means the
      # container itself — the agent's LLM calls died with ECONNREFUSED. vLLM
      # runs on the host, reachable through the gateway alias below.
      AI_URL: http://host.docker.internal:8100/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The OKF tree IS the content database and the app writes to it, so it is
      # a bind mount — inspectable from the host, and recoverable into git.
      - ./deploy/okf-content:/data/okf
      # Uploads/avatars are written at runtime under public/, so they get the
      # same treatment as the OKF tree: mounted, never baked into the image.
      - ./deploy/uploads:/app/public/uploads
      - ./deploy/avatars:/app/public/avatars
      - memory_live_mdmirror:/data/md-mirror
    ports:
      # Loopback only; nginx terminates TLS and proxies here.
      - "127.0.0.1:3120:3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: memory_live
      POSTGRES_USER: memory_live
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - memory_live_pgdata:/var/lib/postgresql/data
    # No published port: dev tooling cannot reach this database by accident.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_live -d memory_live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  memory_live_pgdata:
  memory_live_mdmirror:
