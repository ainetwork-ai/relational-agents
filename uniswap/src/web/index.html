<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Passbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#EBEFEF; --surface:#FAFCFC; --surface-2:#F1F5F5;
  --ink:#13232A; --ink-soft:#5D7379; --rule:#C7D5D6; --rule-strong:#9FB4B6;
  --accent:#12685A; --accent-soft:#DCEBE7; --accent-ink:#0B2E28;
  --stamp:#A8342A; --stamp-soft:#F3DEDA;
  --warn:#8A5A12; --warn-soft:#F7ECD8;
  --shadow:0 1px 2px rgba(19,35,42,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0D1518; --surface:#141F23; --surface-2:#19262B;
    --ink:#DCE7E7; --ink-soft:#8CA2A7; --rule:#27383E; --rule-strong:#3B535A;
    --accent:#43BEA4; --accent-soft:#14312C; --accent-ink:#BFEFE2;
    --stamp:#E47A68; --stamp-soft:#3A1F1B;
    --warn:#E0A36A; --warn-soft:#31220F;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0D1518; --surface:#141F23; --surface-2:#19262B;
  --ink:#DCE7E7; --ink-soft:#8CA2A7; --rule:#27383E; --rule-strong:#3B535A;
  --accent:#43BEA4; --accent-soft:#14312C; --accent-ink:#BFEFE2;
  --stamp:#E47A68; --stamp-soft:#3A1F1B;
  --warn:#E0A36A; --warn-soft:#31220F;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 15px/1.55 "IBM Plex Sans", system-ui, sans-serif; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Zilla Slab", Georgia, serif; font-weight:600; margin:0; text-wrap:balance}
p{margin:0}
a{color:var(--accent); text-underline-offset:3px}
code,.mono{font-family:"IBM Plex Mono", ui-monospace, monospace}
.num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- chrome ---- */
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:var(--surface); border-bottom:1px solid var(--rule)}
.top .bar{max-width:880px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.brand b{font-family:"Zilla Slab", serif; font-size:17px; font-weight:600}
.brand span{font:400 12px/1 "IBM Plex Mono", monospace; color:var(--ink-soft)}
.pill{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule-strong);
  border-radius:999px; padding:4px 10px; font:500 11.5px/1 "IBM Plex Mono", monospace; color:var(--ink-soft);
  background:var(--surface-2);
}
.pill .dot{width:6px; height:6px; border-radius:50%; background:var(--accent)}
.top a.learn{font:500 12.5px/1 "IBM Plex Sans", sans-serif; text-decoration:none; white-space:nowrap}
.top a.learn:hover{text-decoration:underline}

main{max-width:880px; margin:0 auto; padding-inline:16px; padding-block:24px 64px; display:flex; flex-direction:column; gap:22px}
.eyebrow{font:500 11px/1 "IBM Plex Mono", monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}

/* ---- the number that matters ---- */
.saved{display:flex; flex-direction:column; gap:16px; padding:22px 24px; border:1px solid var(--rule-strong); border-radius:3px; background:var(--surface); box-shadow:var(--shadow)}
.saved .lead{display:flex; flex-direction:column; gap:4px}
.saved .big{font:500 clamp(34px,7vw,48px)/1 "IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.saved .for{font-size:14px; color:var(--ink-soft)}
.facts{display:flex; flex-wrap:wrap; gap:0; border-top:1px solid var(--rule); padding-top:14px}
.facts div{flex:1 1 120px; display:flex; flex-direction:column; gap:3px; padding-right:16px}
.facts .k{font:500 10.5px/1 "IBM Plex Mono", monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
.facts .v{font:500 16px/1.2 "IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.delta.up{color:var(--accent)} .delta.down{color:var(--stamp)}

/* ---- cards ---- */
.card{border:1px solid var(--rule-strong); border-radius:3px; background:var(--surface); box-shadow:var(--shadow); overflow:hidden}
.card > header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:13px 18px; border-bottom:1px solid var(--rule); background:var(--surface-2)}
.card > header h2{font-size:15px; margin-right:auto}
.card .in{padding:18px}

.status{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:3px 10px; font:500 11.5px/1.5 "IBM Plex Mono", monospace}
.status.live{background:var(--accent-soft); color:var(--accent)}
.status.dead{background:var(--stamp-soft); color:var(--stamp)}

.terms{display:flex; flex-wrap:wrap; gap:14px 28px; margin-bottom:14px}
.terms div{display:flex; flex-direction:column; gap:2px}
.terms .k{font:500 10.5px/1 "IBM Plex Mono", monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
.terms .v{font:500 15px/1.3 "IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.terms .v small{font-weight:400; color:var(--ink-soft)}

.meter{display:flex; flex-direction:column; gap:6px}
.meter .track{height:7px; border-radius:999px; background:var(--surface-2); border:1px solid var(--rule); overflow:hidden}
.meter .fill{height:100%; background:var(--accent); width:0}
.meter .cap{display:flex; justify-content:space-between; font:400 12px/1 "IBM Plex Mono", monospace; color:var(--ink-soft)}

/* ---- the action ---- */
.verdict{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:3px; border:1px solid}
.verdict .mark{font:500 15px/1.3 "IBM Plex Mono", monospace}
.verdict .txt{display:flex; flex-direction:column; gap:3px}
.verdict .txt b{font:600 15px/1.35 "IBM Plex Sans", sans-serif}
.verdict .txt span{font-size:13.5px; color:var(--ink-soft)}
.verdict.go{border-color:var(--accent); background:var(--accent-soft)} .verdict.go .mark, .verdict.go b{color:var(--accent)}
.verdict.no{border-color:var(--rule-strong); background:var(--surface-2)} .verdict.no .mark{color:var(--ink-soft)}
.verdict.bad{border-color:var(--stamp); background:var(--stamp-soft)} .verdict.bad .mark, .verdict.bad b{color:var(--stamp)}

.actions{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:14px}
button{
  font:500 14px/1 "IBM Plex Sans", sans-serif; cursor:pointer; border-radius:3px;
  padding:10px 16px; border:1px solid var(--rule-strong); background:var(--surface); color:var(--ink);
}
button:hover:not(:disabled){border-color:var(--ink-soft)}
button:disabled{opacity:.45; cursor:not-allowed}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] button.primary, :root:not([data-theme="light"]) button.primary{color:#07201B}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button.quiet{background:transparent; border-color:transparent; color:var(--ink-soft); padding-inline:6px}
button.quiet:hover{color:var(--ink); text-decoration:underline}
button.danger{border-color:var(--stamp); color:var(--stamp); background:transparent}
.hint{font-size:12.5px; color:var(--ink-soft)}

.confirm{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 14px; border:1px solid var(--warn); background:var(--warn-soft); border-radius:3px; margin-top:14px}
.confirm p{font-size:13.5px; margin-right:auto}
.confirm b{color:var(--warn)}

/* ---- passbook ---- */
.rows{display:flex; flex-direction:column}
.row{display:grid; grid-template-columns:86px 1fr auto; gap:14px; align-items:baseline; padding:13px 18px; border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .when{font:400 12px/1.45 "IBM Plex Mono", monospace; color:var(--ink-soft)}
.row .what{display:flex; flex-direction:column; gap:2px; min-width:0}
.row .what b{font:600 14px/1.35 "IBM Plex Sans", sans-serif}
.row .what span{font-size:12.5px; color:var(--ink-soft); overflow-wrap:anywhere}
.row .amt{text-align:right; font:500 14px/1.35 "IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; white-space:nowrap}
.row.buy .what b{color:var(--accent)}
.row.skip .what b{color:var(--ink-soft)}
.row .amt small{display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft)}
@media (max-width:520px){
  .row{grid-template-columns:1fr auto; gap:6px 12px}
  .row .when{grid-column:1 / -1}
}

.empty{padding:28px 18px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center}
.empty p{font-size:14px; color:var(--ink-soft); max-width:46ch}

/* ---- sign form ---- */
.form{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end}
.form label{display:flex; flex-direction:column; gap:5px; font:500 11px/1 "IBM Plex Mono", monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
.form input{
  font:500 15px/1 "IBM Plex Mono", monospace; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--rule-strong); border-radius:3px; padding:9px 10px; width:110px;
}
.form .unit{font:400 12px/1 "IBM Plex Mono", monospace; color:var(--ink-soft); text-transform:none; letter-spacing:0}

/* ---- footer / clock ---- */
.foot{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; padding-top:4px; font-size:12.5px; color:var(--ink-soft)}
.foot .clock{display:flex; align-items:center; gap:8px; margin-right:auto}
.foot input[type=date]{font:400 12px/1 "IBM Plex Mono", monospace; color:var(--ink); background:var(--surface); border:1px solid var(--rule-strong); border-radius:3px; padding:5px 7px}
.foot code{color:var(--ink-soft)}

.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  max-width:calc(100% - 32px); z-index:20;
  border:1px solid var(--rule-strong); background:var(--surface); box-shadow:0 6px 20px rgba(0,0,0,.18);
  border-radius:3px; padding:12px 16px; display:flex; gap:10px; align-items:baseline;
}
.toast b{font:600 14px/1.3 "IBM Plex Sans", sans-serif}
.toast.ok{border-left:3px solid var(--accent)} .toast.ok b{color:var(--accent)}
.toast.err{border-left:3px solid var(--stamp)} .toast.err b{color:var(--stamp)}
.toast a{font-size:13px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<div class="top"><div class="bar">
  <span class="brand"><b>Family Passbook</b> <span>tsumitate on Uniswap v3</span></span>
  <span class="pill" id="chain-pill"><span class="dot"></span><span id="chain-name">…</span></span>
  <span class="pill mono" id="agent-pill">…</span>
  <a class="learn" href="/learn">How it works →</a>
</div></div>

<main>

  <section class="saved">
    <div class="lead">
      <span class="eyebrow">saved for the grandchild</span>
      <span class="big num" id="saved-eth">—</span>
      <span class="for" id="saved-for">loading the passbook…</span>
    </div>
    <div class="facts">
      <div><span class="k">paid in</span><span class="v num" id="fact-paid">—</span></div>
      <div><span class="k">weeks bought</span><span class="v num" id="fact-weeks">—</span></div>
      <div><span class="k">wallet</span><span class="v num" id="fact-wallet">—</span></div>
      <div><span class="k" id="fact-value-k">at today's quote</span><span class="v num" id="fact-value">—</span></div>
    </div>
  </section>

  <section class="card" id="permission-card">
    <header>
      <h2>The permission</h2>
      <span class="status" id="perm-status">—</span>
    </header>
    <div class="in" id="perm-body">
      <p class="hint">loading…</p>
    </div>
  </section>

  <section class="card">
    <header>
      <h2>This week</h2>
      <span class="eyebrow num" id="period-key">—</span>
    </header>
    <div class="in">
      <div class="verdict no" id="verdict">
        <span class="mark">·</span>
        <span class="txt"><b>Checking…</b><span>asking Uniswap what this week's buy would get</span></span>
      </div>
      <div class="actions" id="actions"></div>
      <div id="confirm-slot"></div>
    </div>
  </section>

  <section class="card">
    <header>
      <h2>Passbook</h2>
      <span class="eyebrow" id="entry-count"></span>
    </header>
    <div class="rows" id="rows"><div class="empty"><p>loading…</p></div></div>
  </section>

  <div class="foot">
    <span class="clock">
      <label for="clock" class="eyebrow">demo clock</label>
      <input id="clock" type="date">
      <button class="quiet" id="clock-reset" type="button">today</button>
    </span>
    <span>agent <code id="foot-agent">—</code></span>
    <span>signer <code id="foot-member">—</code></span>
  </div>

</main>

<script>
const $ = (id) => document.getElementById(id);
const USDC_DEC = 6;
const usdc = (v, digits = 2) => (Number(v) / 1e6).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const eth  = (v, digits = 6) => (Number(v) / 1e18).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
const short = (a) => (a ? a.slice(0, 6) + "…" + a.slice(-4) : "—");
const day = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
const time = (iso) => new Date(iso).toISOString().slice(11, 16) + " UTC";

// One sentence per refusal, in the words a family would use. The reason strings come from
// checkMandate and runOnce; an unmapped one is shown raw rather than swallowed.
const SAYS = {
  "period-already-bought": ["Bought already this week", "The next buy unlocks on Monday."],
  "over-per-period-cap":   ["This week's limit is used up", "The weekly cap has been reached under this permission."],
  "over-per-run-cap":      ["Above the per-buy limit", "The amount asked for is larger than one run may spend."],
  "revoked":               ["The permission was revoked", "Nothing can be bought until someone signs a new one."],
  "expired":               ["The permission has expired", "Sign a new one to carry on saving."],
  "unapproved":            ["No signature on this permission", "It cannot be acted on."],
  "approval-invalid":      ["The signature no longer matches", "The terms were changed after signing, so the run refuses."],
  "pair-not-allowed":      ["That pair is not allowed", "This permission only covers USDC into WETH."],
  "no-liquidity":          ["No quote right now", "Uniswap returned nothing for this amount."],
  "swap-failed":           ["The swap did not go through", "Nothing was recorded as bought."],
  "no-mandate":            ["Nobody has signed a permission yet", "Sign one below to start saving."],
};

let state = null, quote = null, busy = false;

// Mon=1 … Sun=7, so 8 − today lands on the next Monday whatever day it is.
const nextMonday = (fromIso) => {
  const d = new Date(fromIso);
  d.setUTCDate(d.getUTCDate() + (8 - (d.getUTCDay() || 7)));
  return d.toISOString().slice(0, 10);
};

const clockParam = () => ($("clock").value ? "?now=" + encodeURIComponent(new Date($("clock").value + "T09:00:00Z").toISOString()) : "");
const clockBody = () => ($("clock").value ? { now: new Date($("clock").value + "T09:00:00Z").toISOString() } : {});

async function call(method, path, body) {
  const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error ?? r.statusText);
  return j;
}

function toast(kind, title, detail, href) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<b></b><span></span>`;
  el.querySelector("b").textContent = title;
  el.querySelector("span").textContent = detail ?? "";
  if (href) { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.textContent = "view transaction"; el.append(a); }
  document.body.append(el);
  setTimeout(() => el.remove(), href ? 15000 : 7000);
}

/* ---------- render ---------- */

function renderHeader() {
  $("chain-name").textContent = state.chain.name + " · " + state.chain.chainId;
  $("agent-pill").textContent = short(state.agent);
  $("foot-agent").textContent = state.agent;
  $("foot-member").textContent = state.member ?? "no signer key loaded";
  $("period-key").textContent = state.periodKey;
}

function renderSaved() {
  const buys = state.entries.filter((e) => e.kind === "buy");
  const paid = buys.reduce((s, e) => s + Number(e.amountIn), 0);
  const got  = buys.reduce((s, e) => s + Number(e.amountOut), 0);
  $("saved-eth").textContent = buys.length ? eth(got) + " WETH" : "0.000000 WETH";
  $("saved-for").textContent = buys.length
    ? `${buys.length} weekly ${buys.length === 1 ? "buy" : "buys"}, the earliest on ${day(buys[0].at)}`
    : "No buys yet — the first one starts the passbook.";
  $("fact-paid").textContent  = usdc(paid) + " USDC";
  $("fact-weeks").textContent = String(buys.length);
  $("fact-wallet").textContent = state.balances ? usdc(Number(state.balances.usdc) * 1e6) + " USDC" : "—";

  // Two measured numbers, never an invented one: today's quote while there is one (a refused week
  // is not quoted), and otherwise the average price these buys actually filled at.
  const el = $("fact-value"), k = $("fact-value-k");
  if (quote && got > 0) {
    const perEth = (Number(quote.amountIn) / 1e6) / (Number(quote.amountOutExpected) / 1e18);
    const worth = (got / 1e18) * perEth;
    const delta = worth - paid / 1e6;
    k.textContent = "at today's quote";
    el.innerHTML = `${worth.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} USDC ` +
      `<span class="delta ${delta >= 0 ? "up" : "down"}">${delta >= 0 ? "+" : "−"}${Math.abs(delta).toFixed(2)}</span>`;
  } else if (got > 0) {
    k.textContent = "average price paid";
    el.textContent = ((paid / 1e6) / (got / 1e18)).toFixed(2) + " USDC/ETH";
  } else { k.textContent = "at today's quote"; el.textContent = "—"; }
}

function renderPermission() {
  const live = state.mandates.find((m) => m.status === "live");
  const m = live ?? state.mandates[state.mandates.length - 1];
  const status = $("perm-status"), body = $("perm-body");

  if (!m) {
    status.className = "status dead"; status.textContent = "none";
    body.innerHTML = `<p class="hint" style="margin-bottom:14px">Nobody has signed yet. A family member signs with their own wallet — the agent holds its own key and never theirs, so it cannot write itself a permission.</p>`;
    body.append(signForm());
    return;
  }

  status.className = "status " + (m.status === "live" ? "live" : "dead");
  status.textContent = m.status;

  const spent = Number(state.spentThisPeriod ?? 0);
  const cap = Number(m.perPeriodCap);
  const pct = cap > 0 ? Math.min(100, (spent / cap) * 100) : 0;

  body.innerHTML = `
    <div class="terms">
      <div><span class="k">per buy</span><span class="v">${usdc(m.perRunCap)} <small>USDC</small></span></div>
      <div><span class="k">per week</span><span class="v">${usdc(m.perPeriodCap)} <small>USDC</small></span></div>
      <div><span class="k">until</span><span class="v">${new Date(m.expiresAt * 1000).toISOString().slice(0, 10)}</span></div>
      <div><span class="k">signed by</span><span class="v">${short(m.approval?.subject)}</span></div>
    </div>
    <div class="meter">
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="cap"><span>${usdc(spent)} USDC used this week</span><span>${usdc(cap)} allowed</span></div>
    </div>
    <div class="actions"></div>`;

  const actions = body.querySelector(".actions");
  if (m.status === "live") {
    const b = document.createElement("button");
    b.className = "danger"; b.textContent = "Revoke this permission";
    b.onclick = () => armConfirm(b, "Revoking stops every future buy under this permission. It cannot be undone — a new one has to be signed.",
      "Revoke", async () => { await call("POST", "/api/mandate/revoke", { id: m.id, ...clockBody() }); toast("ok", "Permission revoked", "Runs will refuse until a new one is signed."); });
    actions.append(b);
  } else {
    actions.append(signForm());
  }
}

function signForm() {
  const wrap = document.createElement("form");
  wrap.className = "form";
  wrap.innerHTML = `
    <label>per buy <input id="f-run" type="number" min="0" step="0.5" value="1"><span class="unit">USDC each week</span></label>
    <label>per week <input id="f-week" type="number" min="0" step="0.5" value="1"><span class="unit">the ceiling</span></label>
    <label>for <input id="f-days" type="number" min="1" step="1" value="90"><span class="unit">days</span></label>
    <button class="primary" type="submit">Sign as ${short(state.member)}</button>`;
  if (!state.member) {
    wrap.querySelector("button").disabled = true;
    wrap.querySelector("button").textContent = "No signer key loaded";
  }
  wrap.onsubmit = (ev) => {
    ev.preventDefault();
    act(async () => {
      const m = await call("POST", "/api/mandate/sign", {
        perRun: $("f-run").value, perPeriod: $("f-week").value, days: $("f-days").value, ...clockBody() });
      toast("ok", "Permission signed", `${usdc(m.perRunCap)} USDC a week, until ${new Date(m.expiresAt * 1000).toISOString().slice(0, 10)}.`);
    });
  };
  return wrap;
}

function renderVerdict(result) {
  const v = $("verdict"), actions = $("actions");
  $("confirm-slot").innerHTML = "";
  actions.innerHTML = "";

  if (result.outcome === "dry-run") {
    const got = eth(result.quote.amountOutExpected);
    v.className = "verdict go";
    v.innerHTML = `<span class="mark">→</span><span class="txt"><b>Ready to buy ${usdc(result.quote.amountIn)} USDC of WETH</b><span>Uniswap quotes ${got} WETH right now, on the 0.05% pool.</span></span>`;
    const go = document.createElement("button");
    go.className = "primary"; go.textContent = `Buy this week's ${usdc(result.quote.amountIn)} USDC`;
    go.onclick = () => armConfirm(go,
      `This sends a real approve and swap from ${short(state.agent)} on ${state.chain.name}. Gas has been about 0.0000008 ETH a buy.`,
      "Buy now", async () => {
        const r = await call("POST", "/api/run", { confirm: true, ...clockBody() });
        if (r.outcome === "bought")
          toast("ok", `Bought ${eth(r.receipt.amountOut)} WETH`, `for ${usdc(r.receipt.amountIn)} USDC, at ${Number(r.receipt.price).toFixed(2)} USDC/ETH.`, state.chain.explorerTx + r.receipt.txHash);
        else toast("err", SAYS[r.reason]?.[0] ?? r.reason, SAYS[r.reason]?.[1] ?? "");
      });
    actions.append(go);
    const dry = document.createElement("button");
    dry.className = "quiet"; dry.textContent = "re-check the quote";
    dry.onclick = () => load();
    actions.append(dry);
    return;
  }

  const reason = result.reason ?? result.outcome;
  const [title, detail] = SAYS[reason] ?? [reason, "This is the reason the run recorded."];
  const bad = ["approval-invalid", "swap-failed", "no-liquidity"].includes(reason);
  v.className = "verdict " + (bad ? "bad" : "no");
  v.innerHTML = `<span class="mark">${bad ? "✕" : "·"}</span><span class="txt"><b></b><span></span></span>`;
  v.querySelector("b").textContent = title;
  v.querySelector(".txt span").textContent = detail;

  // The period refusals are the ones a person resolves by waiting, so the page offers the wait.
  if (reason === "period-already-bought" || reason === "over-per-period-cap") {
    const jump = document.createElement("button");
    jump.className = "primary";
    jump.textContent = "Move the demo clock to next Monday";
    jump.onclick = () => { $("clock").value = nextMonday(state.now); load(); };
    actions.append(jump);
  }

  if (reason !== "no-mandate") {
    const b = document.createElement("button");
    b.textContent = "Run anyway and record the refusal";
    b.onclick = () => act(async () => {
      const r = await call("POST", "/api/run", { confirm: true, ...clockBody() });
      toast("ok", "Recorded", `The passbook now carries “${r.reason ?? r.outcome}” for ${r.periodKey ?? state.periodKey}.`);
    });
    actions.append(b);
    actions.insertAdjacentHTML("beforeend", `<span class="hint">A refusal is a line the family reads, not a silent no-op.</span>`);
  }
}

function renderRows() {
  const rows = $("rows");
  $("entry-count").textContent = state.entries.length ? `${state.entries.length} ${state.entries.length === 1 ? "line" : "lines"}` : "";
  if (!state.entries.length) {
    rows.innerHTML = `<div class="empty"><p>Nothing yet. Every buy and every refusal lands here with its reason, its quote and its transaction.</p></div>`;
    return;
  }
  rows.innerHTML = [...state.entries].reverse().map((e) => {
    if (e.kind === "buy") {
      const link = e.txHash ? `<a href="${state.chain.explorerTx}${e.txHash}" target="_blank">${e.txHash.slice(0, 10)}…</a>` : "";
      return `<div class="row buy">
        <span class="when">${day(e.at)}<br>${time(e.at)}</span>
        <span class="what"><b>Bought WETH</b><span>${e.periodKey} · ${Number(e.price).toFixed(2)} USDC/ETH · ${link}</span></span>
        <span class="amt">+${eth(e.amountOut)}<small>−${usdc(e.amountIn)} USDC</small></span></div>`;
    }
    const [title] = SAYS[e.reason?.split(":")[0]] ?? [e.reason];
    const hash = e.txHash ? ` · <a href="${state.chain.explorerTx}${e.txHash}" target="_blank">${e.txHash.slice(0, 10)}…</a>` : "";
    return `<div class="row skip">
      <span class="when">${day(e.at)}<br>${time(e.at)}</span>
      <span class="what"><b>${title}</b><span>${e.periodKey}${hash}</span></span>
      <span class="amt">—</span></div>`;
  }).join("");
}

/* ---------- actions ---------- */

// Spending real money asks in the page, where the consequence is written out, rather than in a
// browser dialog that says nothing about what it costs.
function armConfirm(trigger, what, verb, run) {
  const slot = $("confirm-slot");
  trigger.disabled = true;
  slot.innerHTML = `<div class="confirm"><p></p><button class="primary">${verb}</button><button class="quiet">Cancel</button></div>`;
  slot.querySelector("p").textContent = what;
  const [yes, no] = slot.querySelectorAll("button");
  no.onclick = () => { slot.innerHTML = ""; trigger.disabled = false; };
  yes.onclick = () => { slot.innerHTML = ""; act(run); };
}

async function act(fn) {
  if (busy) return;
  busy = true;
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try { await fn(); } catch (err) { toast("err", "That did not go through", err.message); }
  busy = false;
  await load();
}

async function load() {
  try {
    state = await call("GET", "/api/state" + clockParam());
  } catch (err) { toast("err", "Cannot reach the passbook", err.message); return; }

  // Spend under the live mandate this period — the meter needs it and /api/state does not total it.
  const live = state.mandates.find((m) => m.status === "live") ?? state.mandates.at(-1);
  state.spentThisPeriod = state.entries
    .filter((e) => e.kind === "buy" && e.mandateId === live?.id && e.periodKey === state.periodKey)
    .reduce((s, e) => s + Number(e.amountIn), 0);

  renderHeader(); renderPermission(); renderRows();

  let result;
  try { result = await call("POST", "/api/dry-run", clockBody()); }
  catch (err) { result = { outcome: "skipped", reason: "swap-failed", error: err.message }; }
  quote = result.outcome === "dry-run" ? result.quote : null;
  renderVerdict(result);
  renderSaved();
  document.querySelectorAll("button").forEach((b) => (b.disabled = false));
  if (!state.member) document.querySelectorAll(".form button").forEach((b) => (b.disabled = true));
}

$("clock").addEventListener("change", load);
$("clock-reset").addEventListener("click", () => { $("clock").value = ""; load(); });
load();
</script>
</body>
</html>
