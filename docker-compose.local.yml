# 로컬 인프라 — 앱은 호스트에서 `scripts/dev.sh`(hot reload)로 돌리고, 여기서는
# backing service 만 띄운다.
#
# ⚠️ ainteams 가 여기서 한 번 데였다: 스택 스크립트가 minio 를 빼먹은 채로 오래 돌았고,
# `isStorageConfigured()` 는 env 때문에 true 인데 접속이 안 돼 **첫 업로드가 500** 이었다
# (디스크 폴백에 도달조차 못 했다). 그래서 규칙은 하나다 — **MINIO_* env 를 켰으면 이
# 컨테이너도 같이 떠 있어야 한다.** 반대로 env 를 비워두면 앱은 디스크 경로로 동작하고
# 이 컨테이너는 필요 없다.
#
#   docker compose -f docker-compose.local.yml up -d minio
#   docker compose -f docker-compose.local.yml down
#
# dev Postgres 는 이 파일이 아니라 별도 compose(포트 5434)로 이미 떠 있다 — 건드리지 않는다.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ainmem_local_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ainmem}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ainmem-local-secret}
    # 로컬에서만 127.0.0.1 로 publish 한다. prod 는 포트를 열지 않는다 — 바이트는
    # 앱의 프록시 라우트로만 나간다.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_local_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio_local_data:
