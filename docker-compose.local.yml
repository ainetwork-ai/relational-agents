# Local infrastructure — the app runs on the host via `scripts/dev.sh` (hot
# reload); only the backing services run here.
#
# ⚠️ ainteams got burned here once: the stack script ran for a long time without
# minio, `isStorageConfigured()` was true because of the env, but nothing could
# connect, so **the first upload was a 500** (it never even reached the disk
# fallback). Hence one rule — **if the MINIO_* env is on, this container must be
# up too.** Conversely, with the env empty the app uses the disk path and this
# container is not needed.
#
#   docker compose -f docker-compose.local.yml up -d minio
#   docker compose -f docker-compose.local.yml down
#
# The dev Postgres is already up from a separate compose (port 5434), not this file — leave it alone.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ainmem_local_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ainmem}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ainmem-local-secret}
    # Published on 127.0.0.1 locally only. prod opens no port — bytes leave only
    # through the app's proxy route.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_local_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio_local_data:
