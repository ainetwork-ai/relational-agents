# ainmem on ainmem.ainetwork.xyz — the family demo, served from the lab host.
#
# Its own compose project, database, volumes and port: `memory-live` (the other
# prod file) names a stack another repo runs on this same host, and sharing a
# project name would let one `up` replace the other's containers.
#
#   docker compose --env-file .env.xyz -f docker-compose.xyz.yml build app
#   docker compose --env-file .env.xyz -f docker-compose.xyz.yml up -d
#
# Traffic: Cloudflare (TLS) → cloudflared tunnel "ainmem-xyz" → 127.0.0.1:3150.
name: ainmem_xyz

services:
  app:
    image: ainmem_xyz-app:${APP_TAG:-latest}
    build:
      context: ./app
      # The World ID values the browser needs, inlined at BUILD time: a value only
      # in .env.xyz reaches the server but never the browser bundle (the IDKit
      # vote silently had no app id here). Pass only what .env.xyz sets — an arg
      # passed empty is inlined as "", which beats the code's `??` defaults
      # (NEXT_PUBLIC_RELATION_REGISTRY_CHAIN_ID "" became chainId 0). Changing
      # one needs a rebuild + new APP_TAG.
      args:
        NEXT_PUBLIC_WORLD_ID_APP_ID: ${NEXT_PUBLIC_WORLD_ID_APP_ID:-}
        NEXT_PUBLIC_WORLD_ID_ENV: ${NEXT_PUBLIC_WORLD_ID_ENV:-}
    restart: unless-stopped
    # Host networking, on purpose. The app's outbound calls — the World ID IdP
    # for every approval, the Base RPC for investments — left through the
    # docker bridge and timed out for minutes at a time while the host itself
    # stayed fine (integration-log.md, 2026-09-26); a step-up that landed in
    # such a window failed as "World ID isn't reachable". On the host's own
    # stack there is no NAT and no embedded resolver in the path. The server
    # binds 127.0.0.1:3150 itself, where nginx already points; postgres is
    # reached on its published loopback port, vLLM on the host's :8110.
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.xyz
    environment:
      PORT: "3150"
      HOSTNAME: 127.0.0.1
      POSTGRES_URL: postgresql://ainmem_xyz:${POSTGRES_PASSWORD}@127.0.0.1:5439/ainmem_xyz
      OKF_ROOT: /data/okf
      MD_MIRROR_ROOT: /data/md-mirror
      # vLLM runs on the host (gemma on :8110)
      AI_URL: http://127.0.0.1:8110/v1
    volumes:
      - ./deploy-xyz/okf-content:/data/okf
      - ./deploy-xyz/uploads:/app/public/uploads
      - ./deploy-xyz/avatars:/app/public/avatars
      - ainmem_xyz_mdmirror:/data/md-mirror

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ainmem_xyz
      POSTGRES_USER: ainmem_xyz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ainmem_xyz_pgdata:/var/lib/postgresql/data
    # loopback only — for schema pushes and the demo seed from this host
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainmem_xyz -d ainmem_xyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ainmem_xyz_pgdata:
  ainmem_xyz_mdmirror:
